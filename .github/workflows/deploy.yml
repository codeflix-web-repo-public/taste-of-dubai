name: Deploy

on:
  # Fired by the WordPress mu-plugin on publish/update via the repository_dispatch API
  repository_dispatch:
    types: [wp-publish]
  # Lets anyone with write access trigger a rebuild manually from the Actions tab
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Rebuild and deploy static files
        run: |
          set -e
          cd "${{ secrets.REPO_DIR }}"
          git fetch origin main
          git reset --hard origin/main
          npm ci --legacy-peer-deps
          npm run build
          rsync -a --delete public/ "${{ secrets.DEPLOY_PATH }}/"
